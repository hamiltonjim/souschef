spring:
  application:
    name: SousChef
  data:
    jpa:
      repositories:
        enabled: true
  datasource:
    username: postgres
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
#        format_sql: true
#    show-sql: true
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration

cors:
  originPatterns:
    - "*"

server:
  port: 8080
  servlet:
    context-path: /souschef
  tomcat:
    remoteip:
      protocol-header-https-value: http

management:
  info:
    defaults:
      enabled: true
    git:
      mode: simple
      enabled: true
    java:
      enabled: true
    env:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
        - info
        - env
        - health
        - loggers
  endpoint:
    health:
      show-details: always
      show-components: always
      mongo:
        enabled: false
    info:
      access: unrestricted

info:
  host: "${HOST}"
  processOwner: ${USER}
  application:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
    encoding: "@project.build.sourceEncoding@"
    java:
      source: "@java.version@"
      target: "@java.version@"
    kotlin:
      version: "@kotlin.version@"
      codeStyle: "@kotlin.code.style@"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-actuator: true
  swagger-ui:
    try-it-out-enabled: true
    filter: true
    display-request-duration: true

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SC_DATABASE}
    password: ${SC_DB_PASSWORD}
